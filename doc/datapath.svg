<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="'Space Grotesk','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1122"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1c2e"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12203a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowA" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L8 4.5L0 9Z" fill="#46618f"/>
    </marker>
    <style>
      .box   { fill:#0e1a2c; stroke:#31507d; stroke-width:1.3; rx:11; }
      .stage { fill:#0e1a2c; stroke:#31507d; stroke-width:1.3; }
      .name  { fill:#eaf1fb; font-size:15px; font-weight:600; }
      .kick  { fill:#8ba3c7; font-size:10.5px; font-family:'Space Mono',monospace; letter-spacing:1.5px; }
      .val   { fill:#37d6cf; font-size:15px; font-family:'Space Mono',monospace; font-weight:700; }
      .mux   { fill:#8ba3c7; font-size:10px; font-family:'Space Mono',monospace; }
      .wire  { stroke:#3c568040; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#1b2c49" stroke-width="1"/>

  <!-- header -->
  <text x="48" y="70" class="name" font-size="42" letter-spacing="1">mulmod</text>
  <text x="49" y="98" class="kick" fill="#37d6cf">CONSTANT-TIME MODULAR MULTIPLIER</text>
  <text x="360" y="70" class="val" font-size="22" opacity="0.9">result = (a · b) mod m</text>
  <line x1="48" y1="118" x2="1232" y2="118" stroke="#1e3152" stroke-width="1"/>

  <!-- cycle telemetry (top right) -->
  <text x="1232" y="66" text-anchor="end" class="kick">CYCLE</text>
  <text id="cyc" x="1232" y="100" text-anchor="end" class="val" font-size="30">00 / 33</text>

  <!-- ================= INPUT REGISTERS (left) ================= -->
  <g>
    <rect x="48" y="196" width="168" height="60" rx="11" fill="url(#accgrad)" stroke="#31507d" stroke-width="1.3"/>
    <text x="64" y="222" class="name" font-size="14">a_reg</text>
    <text x="64" y="242" class="mux">multiplicand · &lt; m</text>

    <rect x="48" y="290" width="168" height="60" rx="11" fill="url(#accgrad)" stroke="#31507d" stroke-width="1.3"/>
    <text x="64" y="316" class="name" font-size="14">b_reg</text>
    <text x="64" y="336" class="mux">shift ◄ · MSB = active bit</text>

    <rect x="48" y="384" width="168" height="60" rx="11" fill="url(#accgrad)" stroke="#31507d" stroke-width="1.3"/>
    <text x="64" y="410" class="name" font-size="14">m_reg</text>
    <text x="64" y="430" class="mux">modulus</text>
  </g>

  <!-- ================= PIPELINE (combinational step) ================= -->
  <!-- band -->
  <text x="264" y="166" class="kick">ONE CONSTANT-TIME STEP · IDENTICAL WORK EVERY CYCLE · MUXES, NOT BRANCHES</text>

  <g id="s_dbl">
    <rect x="264" y="220" width="120" height="62" rx="10" class="stage"/>
    <text x="324" y="248" text-anchor="middle" class="name" font-size="15">×2</text>
    <text x="324" y="268" text-anchor="middle" class="mux">acc « 1</text>
  </g>
  <g id="s_red1">
    <rect x="408" y="220" width="136" height="62" rx="10" class="stage"/>
    <text x="476" y="245" text-anchor="middle" class="name" font-size="14">reduce ⊖</text>
    <text x="476" y="266" text-anchor="middle" class="mux">≥ m ? − m : keep</text>
  </g>
  <g id="s_add">
    <rect x="568" y="220" width="120" height="62" rx="10" class="stage"/>
    <text x="628" y="248" text-anchor="middle" class="name" font-size="15">+ a</text>
    <text x="628" y="268" text-anchor="middle" class="mux">if b-bit</text>
  </g>
  <g id="s_red2">
    <rect x="712" y="220" width="136" height="62" rx="10" class="stage"/>
    <text x="780" y="245" text-anchor="middle" class="name" font-size="14">reduce ⊖</text>
    <text x="780" y="266" text-anchor="middle" class="mux">≥ m ? − m : keep</text>
  </g>
  <g id="s_mux">
    <rect x="872" y="220" width="126" height="62" rx="10" fill="#1a1608" stroke="#c8912f" stroke-width="1.4"/>
    <text x="935" y="245" text-anchor="middle" class="name" font-size="14" fill="#ffce7a">select</text>
    <text x="935" y="266" text-anchor="middle" class="mux" fill="#d8b072">b-bit ? red2 : red1</text>
  </g>

  <!-- ================= ACC + RESULT (right) ================= -->
  <g id="s_acc">
    <rect x="1052" y="206" width="180" height="90" rx="12" fill="url(#accgrad)" stroke="#37d6cf" stroke-width="1.6" filter="url(#glow)"/>
    <text x="1068" y="232" class="name" font-size="14">acc</text>
    <text x="1068" y="250" class="mux">always &lt; m</text>
    <text id="accv" x="1216" y="272" text-anchor="end" class="val" font-size="26">0</text>
  </g>

  <rect x="1052" y="392" width="180" height="72" rx="12" fill="#0c1f18" stroke="#2f9e6f" stroke-width="1.4"/>
  <text x="1068" y="418" class="name" font-size="14" fill="#8ff0c4">result</text>
  <text x="1068" y="436" class="mux" fill="#6fb99a">(a·b) mod m</text>
  <text id="resv" x="1216" y="452" text-anchor="end" class="val" font-size="24" fill="#8ff0c4">—</text>

  <!-- constant-time badge -->
  <rect x="264" y="470" width="322" height="42" rx="21" fill="#0c1930" stroke="#37d6cf" stroke-width="1.2"/>
  <circle cx="290" cy="491" r="5" fill="#37d6cf" filter="url(#glowA)"/>
  <text x="308" y="495" class="kick" fill="#bfe9e6">33 CYCLES · ANY OPERANDS · NO BRANCHES</text>

  <rect x="606" y="470" width="248" height="42" rx="21" fill="#0c1930" stroke="#c8912f" stroke-width="1.1"/>
  <text x="628" y="495" class="kick" fill="#e2c48d">★ FORMALLY VERIFIED · SYMBIYOSYS</text>

  <!-- ================= WIRES ================= -->
  <g fill="none" stroke="#3c5680" stroke-width="1.6" marker-end="url(#arr)">
    <!-- pipeline chain -->
    <path d="M384 251 H408"/>
    <path d="M544 251 H568"/>
    <path d="M688 251 H712"/>
    <path d="M848 251 H872"/>
    <path d="M998 251 H1052"/>
    <!-- inputs into pipeline -->
    <path d="M216 226 H240 V251 H264"/>
    <path d="M216 320 C 700 320, 780 320, 935 292"/>
    <path d="M216 414 C 300 414, 460 300, 476 282"/>
  </g>
  <!-- m into red2 (dashed) -->
  <path d="M216 414 C 420 470, 720 470, 780 282" fill="none" stroke="#3c5680" stroke-width="1.3" stroke-dasharray="4 4"/>
  <!-- red1 bypass into select (if b-bit=0) -->
  <path d="M476 282 C 476 340, 935 350, 935 292" fill="none" stroke="#3c5680" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="3 4"/>
  <!-- feedback: acc -> x2 -->
  <path d="M1142 296 V336 C 1142 372, 324 372, 324 300 V282" fill="none" stroke="#37d6cf" stroke-width="1.5" stroke-opacity="0.55" marker-end="url(#arr)"/>
  <text x="700" y="366" text-anchor="middle" class="mux" fill="#4fb6b0">acc ← step   (loop WIDTH times)</text>
  <!-- acc -> result -->
  <path d="M1142 296 V392" fill="none" stroke="#2f9e6f" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
