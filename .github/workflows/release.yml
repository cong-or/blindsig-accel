name: release

# Publishes a GitHub Release when a v* tag is pushed, using the repository's own
# GITHUB_TOKEN (github-actions[bot] on this repo) — no personal credentials.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish GitHub release from the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME — feasibility prototype" \
            --verify-tag \
            --notes-from-tag
