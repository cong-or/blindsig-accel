name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- simulate + prove the RTL -------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSS CAD Suite (iverilog, yosys, sby, verilator)
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Unit test — constant-time modular multiplier
        run: |
          cd blindsig-rtl
          iverilog -o /tmp/mul tb/tb_mulmod.v rtl/mulmod.v
          vvp /tmp/mul | tee /tmp/mul.log
          grep -q "ALL MULMOD TESTS PASSED" /tmp/mul.log
      - name: Accelerator testbench
        run: |
          cd blindsig-rtl
          iverilog -o /tmp/acc tb/tb_blindsig.v rtl/blindsig_accel.v rtl/redmod.v rtl/mulmod.v
          vvp /tmp/acc | tee /tmp/acc.log
          grep -q "ALL TESTS PASSED" /tmp/acc.log
      - name: Formal proofs (SymbiYosys — k-induction + BMC)
        run: cd blindsig-rtl && make formal

  # ---- full CPU -> bus -> accelerator integration --------------------------
  soc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSS CAD Suite (iverilog)
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: RISC-V bare-metal toolchain (xPack)
        run: |
          url=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v14.2.0-3/xpack-riscv-none-elf-gcc-14.2.0-3-linux-x64.tar.gz
          curl -fsSL -o /tmp/rv.tar.gz "$url"
          mkdir -p "$HOME/rv" && tar -xf /tmp/rv.tar.gz -C "$HOME/rv" --strip-components=1
          echo "$HOME/rv/bin" >> "$GITHUB_PATH"
      - name: SoC integration test — C firmware
        run: cd blindsig-soc && make CROSS=riscv-none-elf-
      - name: Rust bare-metal target
        run: rustup target add riscv32i-unknown-none-elf
      - name: SoC integration test — Rust firmware
        run: cd blindsig-soc && make sim FW=rust CROSS=riscv-none-elf-

  # ---- rebuild the WASM demo from the RTL ----------------------------------
  #      A buildability check (real mulmod.v -> WASM). It does NOT gate the
  #      deploy: the built artifacts are already committed under web/wasm/, so
  #      the live demo stays up even if the Emscripten/Verilator rebuild breaks.
  build-demo:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSS CAD Suite (verilator)
        uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Emscripten
        uses: emscripten-core/setup-emsdk@v14
      - name: Compile mulmod.v -> WASM
        run: cd web/sim && ./build_wasm.sh

  # ---- publish the live demo to GitHub Pages (main only) -------------------
  #      Publishes the committed web/ assets, so it depends only on the RTL
  #      passing — not on the Emscripten/Verilator rebuild above.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable + configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble static site from committed web/
        run: |
          mkdir -p _site
          cp -r web/* _site/
          rm -rf _site/sim _site/obj_dir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
