<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="'Space Grotesk','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0e10"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <linearGradient id="accgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101417"/><stop offset="1" stop-color="#0d0f11"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#14181c" stroke-width="1"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowA" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#3a464e"/></marker>
    <style>
      .stage{fill:#101417;stroke:#2a3540;stroke-width:1.3}
      .name{fill:#b8c5d0;font-size:15px;font-weight:600}
      .kick{fill:#6b7a86;font-size:10.5px;font-family:'Space Mono',monospace;letter-spacing:1.5px}
      .val{fill:#4fd1c5;font-size:15px;font-family:'Space Mono',monospace;font-weight:700}
      .mux{fill:#6b7a86;font-size:10px;font-family:'Space Mono',monospace}
    </style>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#grid)" opacity="0.6"/>
  <text x="48" y="62" class="name" font-size="34" letter-spacing="1">mulmod</text>
  <text x="49" y="86" class="kick" fill="#4fd1c5">CONSTANT-TIME MODULAR MULTIPLIER</text>
  <text x="300" y="60" class="val" font-size="19" opacity="0.9">result = (a · b) mod m</text>
  <line x1="48" y1="104" x2="1232" y2="104" stroke="#1a1f24" stroke-width="1"/>
  <text x="1232" y="56" text-anchor="end" class="kick">CYCLE</text>
  <text id="cyc" x="1232" y="88" text-anchor="end" class="val" font-size="26">00 / 33</text>

  <rect x="48" y="176" width="168" height="56" rx="11" fill="url(#accgrad)" stroke="#2a3540" stroke-width="1.3"/>
  <text x="64" y="200" class="name" font-size="14">a_reg</text><text x="64" y="219" class="mux">multiplicand · &lt; m</text>
  <rect x="48" y="256" width="168" height="56" rx="11" fill="url(#accgrad)" stroke="#2a3540" stroke-width="1.3"/>
  <text x="64" y="280" class="name" font-size="14">b_reg</text><text x="64" y="299" class="mux">shift ◄ · MSB = active bit</text>
  <rect x="48" y="336" width="168" height="56" rx="11" fill="url(#accgrad)" stroke="#2a3540" stroke-width="1.3"/>
  <text x="64" y="360" class="name" font-size="14">m_reg</text><text x="64" y="379" class="mux">modulus</text>

  <text x="264" y="150" class="kick">ONE CONSTANT-TIME STEP · IDENTICAL WORK EVERY CYCLE · MUXES, NOT BRANCHES</text>
  <g id="s_dbl"><rect x="264" y="206" width="120" height="60" rx="10" class="stage"/><text x="324" y="234" text-anchor="middle" class="name">×2</text><text x="324" y="253" text-anchor="middle" class="mux">acc « 1</text></g>
  <g id="s_red1"><rect x="408" y="206" width="136" height="60" rx="10" class="stage"/><text x="476" y="231" text-anchor="middle" class="name" font-size="14">reduce ⊖</text><text x="476" y="251" text-anchor="middle" class="mux">≥ m ? − m : keep</text></g>
  <g id="s_add"><rect x="568" y="206" width="120" height="60" rx="10" class="stage"/><text x="628" y="234" text-anchor="middle" class="name">+ a</text><text x="628" y="253" text-anchor="middle" class="mux">if b-bit</text></g>
  <g id="s_red2"><rect x="712" y="206" width="136" height="60" rx="10" class="stage"/><text x="780" y="231" text-anchor="middle" class="name" font-size="14">reduce ⊖</text><text x="780" y="251" text-anchor="middle" class="mux">≥ m ? − m : keep</text></g>
  <g id="s_mux"><rect x="872" y="206" width="126" height="60" rx="10" fill="#0d1513" stroke="#2c7a7b" stroke-width="1.4"/><text x="935" y="231" text-anchor="middle" class="name" font-size="14" fill="#81e6d9">select</text><text x="935" y="251" text-anchor="middle" class="mux" fill="#6b9a92">b-bit ? red2 : red1</text></g>

  <g id="s_acc"><rect x="1052" y="192" width="180" height="86" rx="12" fill="url(#accgrad)" stroke="#4fd1c5" stroke-width="1.6" filter="url(#glow)"/><text x="1068" y="218" class="name" font-size="14">acc</text><text x="1068" y="236" class="mux">always &lt; m</text><text id="accv" x="1216" y="258" text-anchor="end" class="val" font-size="24">0</text></g>
  <rect x="1052" y="360" width="180" height="68" rx="12" fill="#0d1513" stroke="#2c7a7b" stroke-width="1.4"/>
  <text x="1068" y="386" class="name" font-size="14" fill="#81e6d9">result</text><text x="1068" y="404" class="mux" fill="#6b9a92">(a·b) mod m</text>
  <text id="resv" x="1216" y="420" text-anchor="end" class="val" font-size="22" fill="#81e6d9">—</text>

  <rect x="264" y="436" width="322" height="40" rx="20" fill="#0d1513" stroke="#4fd1c5" stroke-width="1.2"/>
  <circle cx="290" cy="456" r="5" fill="#4fd1c5" filter="url(#glowA)"/><text x="308" y="461" class="kick" fill="#a9e6e0">33 CYCLES · ANY OPERANDS · NO BRANCHES</text>
  <rect x="606" y="436" width="250" height="40" rx="20" fill="#0d1513" stroke="#2c7a7b" stroke-width="1.1"/>
  <text x="628" y="461" class="kick" fill="#4fd1c5">★ FORMALLY VERIFIED · SYMBIYOSYS</text>

  <!-- forward pipeline -->
  <g fill="none" stroke="#3a464e" stroke-width="1.6" marker-end="url(#arr)">
    <path d="M384 236 H408"/><path d="M544 236 H568"/><path d="M688 236 H712"/><path d="M848 236 H872"/><path d="M998 236 H1052"/>
  </g>
  <!-- operand + modulus fan-in (orthogonal traces) -->
  <g fill="none" stroke="#3a464e" stroke-width="1.4" marker-end="url(#arr)">
    <path d="M216 204 V188 H628 V206"/>
    <path d="M216 284 V292 H935 V266"/>
    <path d="M216 364 V320 H476 V266"/>
    <path d="M476 320 H780 V266"/>
  </g>
  <!-- feedback: acc → ×2 (the loop) -->
  <path d="M1142 278 V352 H324 V266" fill="none" stroke="#4fd1c5" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <text x="712" y="344" text-anchor="middle" class="mux" fill="#6b9a92">acc ← step · loop 32×</text>
  <!-- acc → result -->
  <path d="M1142 278 V360" fill="none" stroke="#2c7a7b" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
